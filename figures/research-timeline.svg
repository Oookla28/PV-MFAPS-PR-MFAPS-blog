<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img">
<style>text{font-family:"Songti SC","STSong","SimSun",serif}.title{fill:#2b2824;font-size:25px;font-weight:600}.axis{stroke:#70675d;stroke-width:1}.grid{stroke:#e5ddd1;stroke-width:1}.label{fill:#4b4540;font-size:15px}.small{fill:#766d63;font-size:13px}.legend{fill:#4b4540;font-size:14px}</style>
<text class="title" x="70" y="43">从病害检测到反馈几何的研究路径</text>
<line x1="90" y1="205" x2="1110" y2="205" stroke="#c2b6a5" stroke-width="5"/>
<circle cx="90" cy="205" r="17" fill="#6c7f96"/><text class="label" x="90" y="260" text-anchor="middle">病害检测</text><text class="small" x="90" y="284" text-anchor="middle">C0+S2 / 重采样</text>
<circle cx="260" cy="205" r="17" fill="#74618b"/><text class="label" x="260" y="260" text-anchor="middle">SPD</text><text class="small" x="260" y="284" text-anchor="middle">Raw / Log / 协方差</text>
<circle cx="430" cy="205" r="17" fill="#356da8"/><text class="label" x="430" y="260" text-anchor="middle">机制</text><text class="small" x="430" y="284" text-anchor="middle">读出反馈与差商</text>
<circle cx="600" cy="205" r="17" fill="#b85c38"/><text class="label" x="600" y="260" text-anchor="middle">分配</text><text class="small" x="600" y="284" text-anchor="middle">风险包络与 DP</text>
<circle cx="770" cy="205" r="17" fill="#3d8967"/><text class="label" x="770" y="260" text-anchor="middle">系统</text><text class="small" x="770" y="284" text-anchor="middle">Fused 3→1</text>
<circle cx="940" cy="205" r="17" fill="#9b7447"/><text class="label" x="940" y="260" text-anchor="middle">分区</text><text class="small" x="940" y="284" text-anchor="middle">KL-DRO / PR</text>
<circle cx="1110" cy="205" r="17" fill="#3b8e68"/><text class="label" x="1110" y="260" text-anchor="middle">结果</text><text class="small" x="1110" y="284" text-anchor="middle">HELD once</text>
<text class="small" x="70" y="420">每一轮实验把研究对象从工程效果推向可测机制，再推向可执行的分区鲁棒策略。</text>
</svg>